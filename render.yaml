services:
  - type: web
    name: gardenbuddy
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: gardenbuddy-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: WEATHER_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: THINKING_MACHINES_API_KEY
        sync: false
      - key: DEVRELAY_GATEWAY_URL
        sync: false

databases:
  - name: gardenbuddy-db
    databaseName: gardenbuddy
    user: gardenbuddy_user
    plan: free
    region: oregon

